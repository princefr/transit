# Standalone package (not a member of the transit workspace).
[workspace]

[package]
name = "transit-web"
version = "0.1.0"
edition = "2021"
description = "WASM map frontend for transit GraphQL API"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
gloo-net = { version = "0.6", features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlButtonElement",
  "HtmlSelectElement",
  "Event",
  "EventTarget",
  "InputEvent",
  "KeyboardEvent",
  "MouseEvent",
  "MessageEvent",
  "CloseEvent",
  "ErrorEvent",
  "Node",
  "NodeList",
  "DomTokenList",
  "CssStyleDeclaration",
  "Location",
  "Storage",
  "console",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "Headers",
  "WebSocket",
  "BinaryType",
] }

[profile.release]
opt-level = "s"
lto = true
